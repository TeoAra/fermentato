    <!-- ─── Structured Data: Organization + WebSite + SearchAction ────── -->

        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://fermenta.to/#organization",
        "name": "Fermenta.to",
        "url": "https://fermenta.to",
        "logo": {
          "@type": "ImageObject",
          "url": "https://fermenta.to/icons/icon-512.png",
          "width": 512,
          "height": 512
        },
        "description": "Fermenta.to è la piattaforma italiana dedicata alla birra artigianale. Scopri pub, birrifici, birre craft, taplist in tempo reale, festival della birra e la community degli appassionati.",
        "inLanguage": "it-IT",
        "areaServed": {
          "@type": "Country",
          "name": "Italy",
          "identifier": "IT"
        },
        "knowsAbout": [
          "Birra artigianale", "Craft beer", "Birrifici artigianali", "Pub", "Taplist",
          "Festival della birra", "Degustazione birra", "Stili birra", "ABV", "IBU",
          "Birra italiana", "Homebrewing", "Beer tasting"
        ],
        "sameAs": [
          "https://www.instagram.com/fermenta.to",
          "https://www.facebook.com/fermentato"
        ]
      },
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://fermenta.to/#website",
        "url": "https://fermenta.to",
        "name": "Fermenta.to",

        "publisher": { "@id": "https://fermenta.to/#organization" },
        "inLanguage": "it-IT",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",

          },

      },
      {
        "@context": "https://schema.org",

        "applicationCategory": "FoodApplication",
        "operatingSystem": "iOS, Android, Web",
        "description": "App per scoprire birre artigianali, pub e birrifici in Italia. Taplist in tempo reale, scanner etichette, community di appassionati.",

        "publisher": { "@id": "https://fermenta.to/#organization" },
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "EUR"
        }
      }
    ]

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script defer src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
    <script type="text/javascript">
      window['__onGCastApiAvailable'] = function(isAvailable) {
        if (!isAvailable || !window.cast || !window.cast.framework) return;
        try {
          fetch('/api/cast-config').then(function(r) { return r.json(); }).then(function(config) {
            try {
              var ctx = window.cast.framework.CastContext.getInstance();
              ctx.setOptions({
                receiverApplicationId: config.appId || window.chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
                autoJoinPolicy: window.chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
              });
              window.__castAvailable = true;
              window.__castCustomReceiver = !!config.appId;
              window.dispatchEvent(new Event('castAvailable'));
            } catch(e) { window.__castAvailable = false; }
          }).catch(function() {
            try {
              var ctx = window.cast.framework.CastContext.getInstance();
              ctx.setOptions({
                receiverApplicationId: window.chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
                autoJoinPolicy: window.chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
              });
              window.__castAvailable = true;
              window.__castCustomReceiver = false;
              window.dispatchEvent(new Event('castAvailable'));
            } catch(e) { window.__castAvailable = false; }
          });
        } catch(e) { window.__castAvailable = false; }
      };
    </script>
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>

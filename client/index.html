<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#D97706" />
    <meta name="description" content="Scopri pub, birrifici e birre artigianali italiane. Fermenta.to è la piattaforma per gli amanti della birra craft." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fermenta.to" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <title>Fermenta.to - Birra Artigianale Italiana</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="text/javascript" src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
    <script type="text/javascript">
      window['__onGCastApiAvailable'] = function(isAvailable) {
        if (isAvailable) {
          fetch('/api/cast-config').then(function(r) { return r.json(); }).then(function(config) {
            var ctx = cast.framework.CastContext.getInstance();
            ctx.setOptions({
              receiverApplicationId: config.appId || chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
              autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
            });
            window.__castAvailable = true;
            window.__castCustomReceiver = !!config.appId;
            window.dispatchEvent(new Event('castAvailable'));
          }).catch(function() {
            var ctx = cast.framework.CastContext.getInstance();
            ctx.setOptions({
              receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
              autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
            });
            window.__castAvailable = true;
            window.__castCustomReceiver = false;
            window.dispatchEvent(new Event('castAvailable'));
          });
        }
      };
    </script>
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>

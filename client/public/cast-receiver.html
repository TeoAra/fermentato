<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; }
    #splash {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; color: #F59E0B; font-family: sans-serif; text-align: center;
    }
    #splash h1 { font-size: 64px; margin-bottom: 16px; }
    #splash p { font-size: 24px; color: #9CA3AF; }
    #taplist { width: 100%; height: 100%; border: none; display: none; }
  </style>
</head>
<body>
  <div id="splash">
    <h1>&#127866; Fermenta.to</h1>
    <p id="msg">In attesa...</p>
  </div>
  <iframe id="taplist" allow="autoplay"></iframe>
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script>
    var context = cast.framework.CastReceiverContext.getInstance();
    var ns = 'urn:x-cast:fermenta.to';
    var opts = new cast.framework.CastReceiverOptions();
    opts.disableIdleTimeout = true;
    opts.customNamespaces = {};
    opts.customNamespaces[ns] = cast.framework.system.MessageType.JSON;
    context.addCustomMessageListener(ns, function(e) {
      if (e.data && e.data.url) {
        document.getElementById('taplist').src = e.data.url;
        document.getElementById('taplist').style.display = 'block';
        document.getElementById('splash').style.display = 'none';
      }
    });
    context.start(opts);
  </script>
</body>
</html>

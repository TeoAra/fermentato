name: Build Android APK

# Build Android ora gestito da Codemagic (workflow android-apk).
# Questo workflow rimane solo per esecuzioni manuali se necessario.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platforms
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web assets
        run: |
          echo "::group::npm run build"
          npm run build
          echo "::endgroup::"
          if [ ! -d "dist/public" ] && [ ! -d "dist" ]; then
            echo "::error::Build output directory not found"
            exit 1
          fi
          ls -la dist/ || true

      - name: Add Android platform
        run: |
          # cap add fallisce se la cartella esiste già (cache stale o aggiunta
          # in step precedente fallito). Rimuoviamo per garantire idempotenza.
          if [ -d "android" ]; then
            echo "Cartella android/ esistente, la rimuovo per add pulito"
            rm -rf android
          fi
          npx cap add android

      - name: Setup google-services.json (placeholder — no FCM)
        run: |
          if [ ! -f "android/app/google-services.json" ]; then
            cp scripts/google-services-placeholder.json android/app/google-services.json
            echo "✓ Placeholder FCM — notifiche push native non attive"
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Disable Firebase auto-init (placeholder FCM key)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # Inserisce meta-data prima di </application> per disabilitare
          # l'auto-inizializzazione di Firebase/FCM con credenziali placeholder,
          # prevenendo crash all'avvio dell'APK.
          sed -i 's|</application>|        <meta-data android:name="firebase_messaging_auto_init_enabled" android:value="false" />\n        <meta-data android:name="firebase_analytics_collection_deactivated" android:value="true" />\n    </application>|' "$MANIFEST"
          echo "✓ Firebase auto-init disabilitato in AndroidManifest.xml"
          grep -A2 "firebase_messaging" "$MANIFEST" || true

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fermenta-android-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Summary
        run: |
          echo "### ✅ APK Android pronto" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Scarica l'APK dalla tab **Artifacts** di questo run." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Installa su Android:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "adb install -r app-debug.apk" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ℹ️ Push native non attive (placeholder FCM). Per attivarle aggiungi" >> $GITHUB_STEP_SUMMARY
          echo "> \`GOOGLE_SERVICES_JSON\` come secret GitHub (base64 del file reale)." >> $GITHUB_STEP_SUMMARY

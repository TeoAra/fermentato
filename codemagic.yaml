          BUILD_NUM=$(( VM_MAJOR * 10000 + VM_MINOR * 100 + VM_PATCH + BUILD_NUMBER ))  # + contatore CI Codemagic: build number SEMPRE crescente e univoco anche senza bump di versione (evita 409 "bundle version already used")
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $BUILD_NUM/" android/app/build.gradle
          echo "Android $VERSION (versionCode $BUILD_NUM)"

      - name: Configura firma release con keystore
        script: |
          set -e
          if [ -z "$CM_KEYSTORE" ]; then
            echo "ERRORE: CM_KEYSTORE (base64) non impostato in Codemagic Environment variables"
            exit 1
          fi
          echo "$CM_KEYSTORE" | base64 --decode > /tmp/fermenta_upload.jks
          chmod 600 /tmp/fermenta_upload.jks
          echo "Keystore decodificato in /tmp/fermenta_upload.jks"
          # Inietta signingConfig release in build.gradle (idempotente)
          APP_GRADLE="android/app/build.gradle"
          grep -q "fermenta_upload.jks" "$APP_GRADLE" && { echo "signingConfig già presente"; exit 0; }
          python3 - "$APP_GRADLE" << 'PYEOF'
          import sys, re
          path = sys.argv[1]
          txt = open(path).read()
          signing_block = """
          signingConfigs {
              release {
                  storeFile file("/tmp/fermenta_upload.jks")
                  storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                  keyAlias     System.getenv("CM_KEY_ALIAS")
                  keyPassword  System.getenv("CM_KEY_PASSWORD")
              }
          }
          """
          # Aggiungi signingConfigs prima di buildTypes
          txt = re.sub(r'(\s*buildTypes\s*\{)', signing_block + r'\1', txt, count=1)
          # Imposta signingConfig nel blocco release
          txt = re.sub(
              r'(release\s*\{)',
              r'\1\n            signingConfig signingConfigs.release',
              txt, count=1
          )
          open(path, "w").write(txt)
          print("signingConfig release iniettato in build.gradle")
          PYEOF

      - name: Build AAB release firmato
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon 2>&1
          echo "AAB generato in android/app/build/outputs/bundle/release/"

    artifacts:
      - android/app/build/outputs/bundle/release/*.aab

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        # internal → revisione interna; production → live immediato
        track: internal
      email:
        recipients:
          - info@fermenta.to
        notify:
          success: true
          failure: true

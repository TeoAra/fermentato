            /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription 'Fermenta.to usa la posizione per mostrarti pub e birrifici vicino a te.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string 'Fermenta.to usa la posizione per mostrarti pub e birrifici vicino a te.'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSLocationAlwaysAndWhenInUseUsageDescription 'Fermenta.to usa la posizione per mostrarti pub e birrifici vicino a te.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'Fermenta.to usa la rete locale per trovare dispositivi Chromecast vicini.'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSLocalNetworkUsageDescription 'Fermenta.to usa la rete locale per trovare dispositivi Chromecast vicini.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices:0 string '_googlecast._tcp'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices:1 string '_${CAST_APP_ID}._googlecast._tcp'" "$PLIST" 2>/dev/null || true
          # AirPlay 2: necessario per scoprire LG TV, Samsung TV, Apple TV tramite picker
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices:2 string '_airplay._tcp'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices:3 string '_raop._tcp'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          # Google Sign-In: registra l'URL scheme reversed del client ID iOS
          # cosi' iOS sa rilanciare l'app dopo il callback OAuth.
          python3 ios-native/add_google_url_scheme.py "$PLIST" \
            "com.googleusercontent.apps.131123139785-stv42sugd3i1u0lb3u0jssoink746n81"
          echo "Info.plist aggiornato:"
          /usr/libexec/PlistBuddy -c "Print" "$PLIST"

      - name: Inizializza keychain
        script: keychain initialize

      - name: Prepara chiave privata per certificato
        script: |
          if [ -n "$APPLE_DISTRIBUTION_PRIVATE_KEY" ]; then
            echo "$APPLE_DISTRIBUTION_PRIVATE_KEY" | base64 --decode > /tmp/apple_distribution_private_key
            chmod 600 /tmp/apple_distribution_private_key
            echo "Chiave caricata da env var APPLE_DISTRIBUTION_PRIVATE_KEY"
          else
            ssh-keygen -t rsa -b 2048 -m PEM -f /tmp/apple_distribution_private_key -q -N ""
            echo "ATTENZIONE: chiave generata al volo. Imposta APPLE_DISTRIBUTION_PRIVATE_KEY in Codemagic per build stabili."
          fi

      - name: Scarica certificati e profili (credenziali da integrazione UI)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/apple_distribution_private_key \
            --create

      - name: Aggiungi certificati al keychain
        script: keychain add-certificates

      - name: Applica profili al progetto Xcode
        script: xcode-project use-profiles

      - name: Build IPA per App Store
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # true = invia per review App Store appena arriva su TestFlight
        submit_to_app_store: true
      email:
        recipients:
          - info@fermenta.to
        notify:
          success: true
          failure: true

  # ─── Build Android APK ────────────────────────────────────────────────────────
  android-apk:
    name: Android APK → Download diretto
    max_build_duration: 60
    instance_type: linux_x2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    environment:
      node: "20"
      java: "21"
      vars:
        PACKAGE_NAME: to.fermenta.app
        CAST_APP_ID: 6666EC62

    cache:
      cache_paths:
        - $HOME/.npm
        - $CM_BUILD_DIR/node_modules
        - ~/.gradle/caches

    scripts:
      - name: Install Node dependencies
        script: npm ci

      - name: Build web assets
        script: npm run build

      - name: Add Android platform + copy assets
        script: |
          if [ ! -d "android" ]; then
            npx cap add android || true
          fi
          if [ ! -f "android/app/build.gradle" ]; then
            echo "ERRORE: build.gradle non trovato dopo cap add android"
            exit 1
          fi
          # cap sync (non solo copy) per fondere AndroidManifest dei plugin
          # — necessario per @capacitor/geolocation che dichiara ACCESS_FINE_LOCATION
          npx cap sync android

      - name: Inietta plugin NativeCast Android (Chromecast nativo)
        script: |
          # ── 1. Rileva package reale dell'app (può differire da to.fermentato.app) ──
          MAIN_FILE=$(find android/app/src/main/java \( -name 'MainActivity.kt' -o -name 'MainActivity.java' \) 2>/dev/null | head -1)
          PKG=""
          if [ -n "$MAIN_FILE" ]; then
            PKG=$(grep -oP '^package\s+\K[a-zA-Z0-9_.]+' "$MAIN_FILE" | head -1)
          fi
          if [ -z "$PKG" ]; then
            PKG=$(grep -oP "applicationId\s+[\"']\K[^\"']+" android/app/build.gradle 2>/dev/null | head -1)
          fi
          if [ -z "$PKG" ]; then
            PKG="to.fermenta.app"
          fi
          PKG_PATH=${PKG//./\/}
          PKG_DIR="android/app/src/main/java/$PKG_PATH"
          mkdir -p "$PKG_DIR"
          echo "Package Android rilevato: $PKG → $PKG_DIR"

          # ── 2. Copia + riscrivi package nei sorgenti Kotlin del plugin ─────────────
          # Rimuovi copie stale in package vecchi (build precedenti)
          find android/app/src/main/java \( -name 'NativeCastPlugin.kt' -o -name 'CastOptionsProvider.kt' \) \
            -not -path "$PKG_DIR/*" -print -delete 2>/dev/null || true
          cp android-native/NativeCastPlugin.kt    "$PKG_DIR/"
          cp android-native/CastOptionsProvider.kt "$PKG_DIR/"
          sed -i "s/^package .*/package $PKG/" "$PKG_DIR/NativeCastPlugin.kt"
          sed -i "s/^package .*/package $PKG/" "$PKG_DIR/CastOptionsProvider.kt"

          # ── 3. Assicura supporto Kotlin (classpath root + plugin app) ──────────────
          ROOT_GRADLE="android/build.gradle"
          APP_GRADLE="android/app/build.gradle"
          # Upsert: rimuove eventuali versioni vecchie e forza 2.1.0
          sed -i '/kotlin-gradle-plugin/d' "$ROOT_GRADLE"
          sed -i '0,/classpath\s*["'"'"']com\.android\.tools\.build:gradle/{s#\(classpath\s*["'"'"']com\.android\.tools\.build:gradle[^"'"'"']*["'"'"']\)#\1\n        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0"#}' "$ROOT_GRADLE"
          echo "kotlin-gradle-plugin:2.1.0 forzato nel classpath di $ROOT_GRADLE"
          if ! grep -qE "(kotlin-android|org.jetbrains.kotlin.android)" "$APP_GRADLE"; then
            sed -i '0,/apply plugin: .com.android.application./{s//apply plugin: "com.android.application"\napply plugin: "kotlin-android"/}' "$APP_GRADLE"
            echo "Plugin kotlin-android applicato in $APP_GRADLE"
          fi

          # ── 4. Registra il plugin in MainActivity (Java o Kotlin) ──────────────────
          if [ -z "$MAIN_FILE" ]; then
            echo "MainActivity non trovata: la genero in $PKG_DIR/MainActivity.kt"
            cat > "$PKG_DIR/MainActivity.kt" <<KTEOF
          package $PKG

          import com.getcapacitor.BridgeActivity

          class MainActivity : BridgeActivity()
          KTEOF
            sed -i 's/^          //' "$PKG_DIR/MainActivity.kt"
            MAIN_FILE="$PKG_DIR/MainActivity.kt"
          fi
          # Rimuove qualsiasi import + registerPlugin stale prima di reinserire
          sed -i '/^import .*\.NativeCastPlugin;\?$/d' "$MAIN_FILE"
          sed -i '/registerPlugin(NativeCastPlugin/d' "$MAIN_FILE"
          case "$MAIN_FILE" in
            *.java)
              sed -i "s|import com.getcapacitor.BridgeActivity;|import com.getcapacitor.BridgeActivity;\nimport $PKG.NativeCastPlugin;|" "$MAIN_FILE"
              # IMPORTANTE: registerPlugin DEVE essere PRIMA di super.onCreate
              sed -i 's/super.onCreate(savedInstanceState);/registerPlugin(NativeCastPlugin.class);\n        super.onCreate(savedInstanceState);/' "$MAIN_FILE"
              echo "MainActivity.java aggiornata con NativeCastPlugin → $PKG ($MAIN_FILE)"
              ;;
            *.kt)
              sed -i "s|import com.getcapacitor.BridgeActivity|import com.getcapacitor.BridgeActivity\nimport $PKG.NativeCastPlugin|" "$MAIN_FILE"
              if ! grep -q "registerPlugin(NativeCastPlugin" "$MAIN_FILE"; then
                if grep -q "override fun onCreate" "$MAIN_FILE"; then
                  sed -i 's/super.onCreate(savedInstanceState)/registerPlugin(NativeCastPlugin::class.java)\n        super.onCreate(savedInstanceState)/' "$MAIN_FILE"
                else
                  python3 - "$MAIN_FILE" <<'PYEOF'
          import sys
          p = sys.argv[1]
          txt = open(p).read()
          inject = """
              override fun onCreate(savedInstanceState: android.os.Bundle?) {
                  registerPlugin(NativeCastPlugin::class.java)
                  super.onCreate(savedInstanceState)
              }
          """
          idx = txt.rstrip().rfind("}")
          open(p, "w").write(txt[:idx] + inject + txt[idx:])
          PYEOF
                fi
              fi
              echo "MainActivity.kt aggiornata con NativeCastPlugin ($MAIN_FILE)"
              ;;
          esac

          # ── 4b. Registra NativeCast in capacitor.plugins.json (registry runtime) ──
          PLUGINS_JSON="android/app/src/main/assets/capacitor.plugins.json"
          mkdir -p "$(dirname "$PLUGINS_JSON")"
          [ ! -f "$PLUGINS_JSON" ] && echo "[]" > "$PLUGINS_JSON"
          PKG_FOR_PY="$PKG" python3 - "$PLUGINS_JSON" <<'PYEOF'
          import json, os, sys
          path = sys.argv[1]
          pkg  = os.environ["PKG_FOR_PY"]
          classpath = f"{pkg}.NativeCastPlugin"
          try:
              data = json.load(open(path))
              if not isinstance(data, list):
                  data = []
          except Exception:
              data = []
          data = [p for p in data if p.get("classpath") != classpath]
          data.append({"pkg": pkg, "classpath": classpath})
          json.dump(data, open(path, "w"), indent=2)
          print(f"NativeCast registrato in {path} → {classpath}")
          PYEOF

          # ── 5. Dipendenze Cast in build.gradle ─────────────────────────────────────
          grep -q "play-services-cast-framework" "$APP_GRADLE" || \
            sed -i '/dependencies {/a\    implementation "com.google.android.gms:play-services-cast-framework:21.5.0"\n    implementation "androidx.mediarouter:mediarouter:1.7.0"' "$APP_GRADLE"
          echo "Dipendenze Cast aggiunte a $APP_GRADLE"

          # ── 6. Registra CastOptionsProvider in AndroidManifest (con package giusto) ─
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 android-native/inject_cast_manifest.py "$MANIFEST" "$PKG"

      - name: Aggiungi permessi AndroidManifest (Cast + Camera + Location)
        script: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # Rete locale per Chromecast discovery
          grep -q "CHANGE_NETWORK_STATE" "$MANIFEST" || \
            sed -i 's|<uses-permission android:name="android.permission.INTERNET"/>|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n    <uses-permission android:name="android.permission.CHANGE_WIFI_STATE"/>|' "$MANIFEST"
          # mDNS per Cast discovery su Android 12+
          grep -q "CHANGE_WIFI_MULTICAST_STATE" "$MANIFEST" || \
            sed -i 's|<uses-permission android:name="android.permission.INTERNET"/>|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/>|' "$MANIFEST"
          # NEARBY_WIFI_DEVICES: OBBLIGATORIO su Android 13+ (API 33+) per fare
          # discovery dei Chromecast sulla rete locale via mDNS. Senza, il
          # MediaRouteChooserDialog mostra "Nessun dispositivo trovato" anche
          # se il Chromecast è acceso e sulla stessa wifi.
          # usesPermissionFlags="neverForLocation" → evita di dover chiedere
          # ACCESS_FINE_LOCATION runtime solo per Cast.
          grep -q "NEARBY_WIFI_DEVICES" "$MANIFEST" || \
            sed -i 's|<uses-permission android:name="android.permission.INTERNET"/>|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" android:usesPermissionFlags="neverForLocation" tools:targetApi="33"/>\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>|' "$MANIFEST"
          # Aggiungi xmlns:tools al tag <manifest> se manca (richiesto da tools:targetApi)
          grep -q 'xmlns:tools=' "$MANIFEST" || \
            sed -i 's|<manifest |<manifest xmlns:tools="http://schemas.android.com/tools" |' "$MANIFEST"
          # Geolocalizzazione (richiesta da @capacitor/geolocation per mostrare
          # il dialog di sistema su Android). Mettiamo entrambi i permessi:
          # FINE = GPS preciso, COARSE = wifi/cell-tower fallback.
          grep -q "ACCESS_FINE_LOCATION" "$MANIFEST" || \
            sed -i 's|<uses-permission android:name="android.permission.INTERNET"/>|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>|' "$MANIFEST"
          echo "AndroidManifest aggiornato:"
          grep "uses-permission" "$MANIFEST"

      - name: Imposta versione e build number
        script: |
          VERSION=$(node -p "require('./version.json').version")
          IFS='.' read -r VM_MAJOR VM_MINOR VM_PATCH <<< "$VERSION"
          BUILD_NUM=$(( VM_MAJOR * 10000 + VM_MINOR * 100 + VM_PATCH + BUILD_NUMBER ))  # + contatore CI Codemagic: build number SEMPRE crescente e univoco anche senza bump di versione (evita 409 "bundle version already used")
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $BUILD_NUM/" android/app/build.gradle
          echo "Android $VERSION (versionCode $BUILD_NUM)"

      - name: Build APK debug
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - info@fermenta.to
        notify:
          success: true
          failure: true

  # ─── Build Android AAB firmato → Google Play ─────────────────────────────────
  # Trigger: tag v* (es. v1.2.3) — stessa logica di ios-appstore.
  # Variabili d'ambiente da impostare in Codemagic (Environment variables):
  #   CM_KEYSTORE          → contenuto del file .jks in base64

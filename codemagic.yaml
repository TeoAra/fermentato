# ═══════════════════════════════════════════════════════════════════════════════
# Codemagic CI/CD — Fermenta.to iOS IPA
#
# Setup (una tantum su codemagic.io):
#   1. Crea account su https://codemagic.io (gratis, 500 min macOS/mese)
#   2. Collega il repo GitHub
#   3. In "Team settings" → "Code signing identities":
#      - Carica il tuo certificato iOS (.p12) e la passphrase
#      - Carica il provisioning profile (.mobileprovision)
#   4. In questo workflow imposta le variabili d'ambiente:
#      - APP_STORE_CONNECT_ISSUER_ID   (per firma automatica, opzionale)
#      - APP_STORE_CONNECT_KEY_ID
#      - APP_STORE_CONNECT_PRIVATE_KEY
#
# Senza il programma Apple ($99/anno):
#   - distribution_type: development
#   - IPA valida 7 giorni, installabile via AltStore o Sideloadly
#   - NON pubblicabile sull'App Store
# ═══════════════════════════════════════════════════════════════════════════════

workflows:

  # ─── Build senza firma (verifica che il codice compili — nessun certificato richiesto) ─
  # Per ottenere un IPA firmato installabile via AltStore/Sideloadly:
  #   1. Su Mac: Xcode → Preferences → Accounts → aggiungi il tuo Apple ID gratuito
  #   2. Crea un progetto fittizio con bundle ID "to.fermenta.app" → lascia che Xcode
  #      generi automaticamente certificato e provisioning profile
  #   3. Esporta il certificato da Keychain Access (.p12) e copia il profilo da
  #      ~/Library/MobileDevice/Provisioning\ Profiles/ (.mobileprovision)
  #   4. Su codemagic.io → apri il team → Code signing identities → carica .p12 + .mobileprovision
  #   5. Decommenta il blocco ios_signing qui sotto e commenta il build senza firma
  ios-development:
    name: iOS Build (no signing — compile check)
    max_build_duration: 60
    instance_type: mac_mini_m1

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    environment:
      node: "20"
      xcode: latest
      cocoapods: default
      # ── Decommenta quando hai caricato certificato + provisioning profile su Codemagic ──
      # ios_signing:
      #   distribution_type: development
      #   bundle_identifier: to.fermenta.app

    cache:
      cache_paths:
        - $HOME/.npm
        - $CM_BUILD_DIR/node_modules
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Install Node dependencies
        script: npm ci

      - name: Build web assets
        script: npm run build

      - name: Add iOS platform
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor (plugin nativi + web assets)
        script: npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Build app (senza firma — solo verifica compilazione)
        script: |
          xcodebuild build \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty
      # ── Decommenta il blocco seguente (e commenta quello sopra) dopo aver caricato i certificati ──
      # - name: Build IPA firmato (richiede certificato su Codemagic)
      #   script: |
      #     xcode-project use-profiles
      #     xcode-project build-ipa \
      #       --workspace ios/App/App.xcworkspace \
      #       --scheme App

    artifacts:
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - info@fermenta.to
        notify:
          success: true
          failure: true

  # ─── Build App Store IPA (richiede programma $99/anno) ───────────────────────
  ios-appstore:
    name: iOS App Store IPA
    max_build_duration: 60
    instance_type: mac_mini_m1

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true

    environment:
      node: "20"
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: to.fermenta.app
      # Aggiungi questi secret in Codemagic → Team settings → Environment variables:
      # APP_STORE_CONNECT_ISSUER_ID
      # APP_STORE_CONNECT_KEY_ID
      # APP_STORE_CONNECT_PRIVATE_KEY (contenuto del file .p8)
      vars:
        APP_STORE_CONNECT_ISSUER_ID: $APP_STORE_CONNECT_ISSUER_ID
        APP_STORE_CONNECT_KEY_ID: $APP_STORE_CONNECT_KEY_ID
        APP_STORE_CONNECT_PRIVATE_KEY: $APP_STORE_CONNECT_PRIVATE_KEY

    cache:
      cache_paths:
        - $HOME/.npm
        - $CM_BUILD_DIR/node_modules
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Install Node dependencies
        script: npm ci

      - name: Build web assets
        script: npm run build

      - name: Add iOS platform
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor
        script: npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Build IPA per App Store
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - info@fermenta.to
        notify:
          success: true
          failure: true

# ═══════════════════════════════════════════════════════════════════════════════
# Codemagic CI/CD — Fermenta.to iOS IPA (firma automatica, senza Mac fisico)
# ═══════════════════════════════════════════════════════════════════════════════

workflows:

  # ─── Build IPA firmato → TestFlight ─────────────────────────────────────────
  ios-development:
    name: iOS IPA → TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m1

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    environment:
      node: "20"
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: to.fermentato.app
      vars:
        APP_STORE_CONNECT_ISSUER_ID: $APP_STORE_CONNECT_ISSUER_ID
        APP_STORE_CONNECT_KEY_ID: $APP_STORE_CONNECT_KEY_ID
        APP_STORE_CONNECT_PRIVATE_KEY: $APP_STORE_CONNECT_PRIVATE_KEY
        BUNDLE_ID: to.fermentato.app

    cache:
      cache_paths:
        - $HOME/.npm
        - $CM_BUILD_DIR/node_modules
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Install Node dependencies
        script: npm ci

      - name: Build web assets
        script: npm run build

      - name: Add iOS platform + fix deployment target + pod install
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios || true
          fi
          if [ ! -f "ios/App/Podfile" ]; then
            echo "ERRORE: Podfile non trovato dopo cap add ios"
            exit 1
          fi
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '16.0'/" ios/App/Podfile
          grep "platform :ios" ios/App/Podfile
          cd ios/App && pod install

      - name: Copia web assets nel progetto iOS
        script: npx cap copy ios

      - name: Imposta versione app
        script: |
          VERSION=$(node -p "require('./package.json').version")
          xcrun agvtool new-marketing-version "$VERSION"
          xcrun agvtool new-version -all "${CM_BUILD_NUMBER:-1}"

      - name: Inizializza keychain per code signing
        script: keychain initialize

      - name: Scarica profili di firma da App Store Connect
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Aggiungi certificati al keychain
        script: keychain add-certificates

      - name: Applica profili al progetto Xcode
        script: xcode-project use-profiles

      - name: Build IPA firmato
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - info@fermenta.to
        notify:
          success: true
          failure: true

  # ─── Build App Store IPA (trigger su tag v*) ─────────────────────────────────
  ios-appstore:
    name: iOS App Store IPA
    max_build_duration: 60
    instance_type: mac_mini_m1

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true

    environment:
      node: "20"
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: to.fermentato.app
      vars:
        APP_STORE_CONNECT_ISSUER_ID: $APP_STORE_CONNECT_ISSUER_ID
        APP_STORE_CONNECT_KEY_ID: $APP_STORE_CONNECT_KEY_ID
        APP_STORE_CONNECT_PRIVATE_KEY: $APP_STORE_CONNECT_PRIVATE_KEY
        BUNDLE_ID: to.fermentato.app

    cache:
      cache_paths:
        - $HOME/.npm
        - $CM_BUILD_DIR/node_modules
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Install Node dependencies
        script: npm ci

      - name: Build web assets
        script: npm run build

      - name: Add iOS platform + fix deployment target + pod install
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios || true
          fi
          if [ ! -f "ios/App/Podfile" ]; then
            echo "ERRORE: Podfile non trovato dopo cap add ios"
            exit 1
          fi
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '16.0'/" ios/App/Podfile
          grep "platform :ios" ios/App/Podfile
          cd ios/App && pod install

      - name: Copia web assets nel progetto iOS
        script: npx cap copy ios

      - name: Inizializza keychain per code signing
        script: keychain initialize

      - name: Scarica profili di firma da App Store Connect
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Aggiungi certificati al keychain
        script: keychain add-certificates

      - name: Applica profili al progetto Xcode
        script: xcode-project use-profiles

      - name: Build IPA per App Store
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - info@fermenta.to
        notify:
          success: true
          failure: true

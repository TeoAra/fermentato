          grep -q "google-cast-sdk" Podfile.lock || { echo "ERRORE: google-cast-sdk non in Podfile.lock"; exit 1; }
          echo "google-cast-sdk installato correttamente"

      - name: Genera splash screen iOS (resources/splash.png → native Assets)
        script: |
          # Sostituisce il default Capacitor (X blu) con il logo Fermenta.to
          npm install -D @capacitor/assets --no-audit --no-fund 2>/dev/null || true
          npx @capacitor/assets generate --splashscreen --ios || true
          echo "Splash screen iOS generato da resources/splash.png"


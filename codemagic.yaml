# ═══════════════════════════════════════════════════════════════════════════════
# Codemagic CI/CD — Fermenta.to iOS IPA (firma automatica, senza Mac fisico)
#
# SETUP UNA TANTUM (tutto da browser, no Mac):
#
# 1. Acquista Apple Developer Program → https://developer.apple.com ($99/anno)
#
# 2. Crea App Store Connect API Key:
#    → https://appstoreconnect.apple.com → Utenti e accesso → Chiavi API
#    → Nuova chiave, ruolo "App Manager"
#    → Scarica il file .p8 (solo una volta!)
#    → Annota: Issuer ID (in cima alla pagina) e Key ID (nella lista)
#
# 3. Aggiungi 3 variabili su Codemagic → apri il team → Team settings →
#    Environment variables (spunta "Secure"):
#    - APP_STORE_CONNECT_ISSUER_ID   → l'Issuer ID copiato sopra
#    - APP_STORE_CONNECT_KEY_ID      → il Key ID copiato sopra
#    - APP_STORE_CONNECT_PRIVATE_KEY → il contenuto del file .p8
#      (apri il file con un editor di testo, copia tutto incluso BEGIN/END)
#
# 4. Registra il bundle ID su Apple Developer:
#    → https://developer.apple.com/account → Certificates, IDs & Profiles
#    → Identifiers → + → App IDs → bundle ID: to.fermenta.app
#
# Codemagic gestisce tutto il resto: crea certificati, profili, firma e
# carica su TestFlight automaticamente. Zero Mac fisico richiesto.
# ═══════════════════════════════════════════════════════════════════════════════

workflows:

  # ─── Build IPA firmato → TestFlight (firma automatica via App Store Connect API) ──
  ios-development:
    name: iOS IPA → TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m1

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    environment:
      node: "20"
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: to.fermenta.app
      vars:
        APP_STORE_CONNECT_ISSUER_ID: $APP_STORE_CONNECT_ISSUER_ID
        APP_STORE_CONNECT_KEY_ID: $APP_STORE_CONNECT_KEY_ID
        APP_STORE_CONNECT_PRIVATE_KEY: $APP_STORE_CONNECT_PRIVATE_KEY

    cache:
      cache_paths:
        - $HOME/.npm
        - $CM_BUILD_DIR/node_modules
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Install Node dependencies
        script: npm ci

      - name: Build web assets
        script: npm run build

      - name: Add iOS platform + fix deployment target + pod install
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios || true
          fi
          if [ ! -f "ios/App/Podfile" ]; then
            echo "ERRORE: Podfile non trovato dopo cap add ios"
            exit 1
          fi
          # Capacitor 8 richiede iOS 16.0+
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '16.0'/" ios/App/Podfile
          grep "platform :ios" ios/App/Podfile
          cd ios/App && pod install

      - name: Copia web assets nel progetto iOS
        script: npx cap copy ios

      - name: Imposta versione app
        script: |
          # Legge la versione da package.json e la imposta nell'Info.plist
          VERSION=$(node -p "require('./package.json').version")
          BUILD=$GITHUB_RUN_NUMBER
          xcrun agvtool new-marketing-version "$VERSION"
          xcrun agvtool new-version -all "${BUILD:-1}"

      - name: Build IPA firmato
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - info@fermenta.to
        notify:
          success: true
          failure: true

  # ─── Build App Store IPA (richiede programma $99/anno) ───────────────────────
  ios-appstore:
    name: iOS App Store IPA
    max_build_duration: 60
    instance_type: mac_mini_m1

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true

    environment:
      node: "20"
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: to.fermenta.app
      # Aggiungi questi secret in Codemagic → Team settings → Environment variables:
      # APP_STORE_CONNECT_ISSUER_ID
      # APP_STORE_CONNECT_KEY_ID
      # APP_STORE_CONNECT_PRIVATE_KEY (contenuto del file .p8)
      vars:
        APP_STORE_CONNECT_ISSUER_ID: $APP_STORE_CONNECT_ISSUER_ID
        APP_STORE_CONNECT_KEY_ID: $APP_STORE_CONNECT_KEY_ID
        APP_STORE_CONNECT_PRIVATE_KEY: $APP_STORE_CONNECT_PRIVATE_KEY

    cache:
      cache_paths:
        - $HOME/.npm
        - $CM_BUILD_DIR/node_modules
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Install Node dependencies
        script: npm ci

      - name: Build web assets
        script: npm run build

      - name: Add iOS platform + fix deployment target + pod install
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios || true
          fi
          if [ ! -f "ios/App/Podfile" ]; then
            echo "ERRORE: Podfile non trovato dopo cap add ios"
            exit 1
          fi
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '16.0'/" ios/App/Podfile
          grep "platform :ios" ios/App/Podfile
          cd ios/App && pod install

      - name: Copia web assets nel progetto iOS
        script: npx cap copy ios

      - name: Build IPA per App Store
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - info@fermenta.to
        notify:
          success: true
          failure: true

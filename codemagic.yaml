  # ─── Build Android APK ────────────────────────────────────────────────────────
  android-apk:
    name: Android APK → Download diretto
    max_build_duration: 60
    instance_type: linux_x2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    environment:
      node: "20"
      java: "21"
      vars:
        PACKAGE_NAME: to.fermentato.app
        CAST_APP_ID: 6666EC62

    cache:
      cache_paths:
        - $HOME/.npm
        - $CM_BUILD_DIR/node_modules
        - ~/.gradle/caches

    scripts:
      - name: Install Node dependencies
        script: npm ci

      - name: Build web assets
        script: npm run build

      - name: Add Android platform + copy assets
        script: |
          if [ ! -d "android" ]; then
            npx cap add android || true
          fi
          if [ ! -f "android/app/build.gradle" ]; then
            echo "ERRORE: build.gradle non trovato dopo cap add android"
            exit 1
          fi
          npx cap copy android

      - name: Inietta plugin NativeCast Android (Chromecast nativo)
        script: |
          PKG_DIR="android/app/src/main/java/to/fermentato/app"
          mkdir -p "$PKG_DIR"

          # ── 1. Copia i sorgenti Kotlin del plugin ──────────────────────────
          cp android-native/NativeCastPlugin.kt   "$PKG_DIR/"
          cp android-native/CastOptionsProvider.kt "$PKG_DIR/"

          # ── 2. Registra il plugin in MainActivity ──────────────────────────
          MAIN="$PKG_DIR/MainActivity.java"
          if [ -f "$MAIN" ]; then
            # Aggiungi import se non c'è già
            grep -q "NativeCastPlugin" "$MAIN" || \
              sed -i 's/import com.getcapacitor.BridgeActivity;/import com.getcapacitor.BridgeActivity;\nimport to.fermentato.app.NativeCastPlugin;/' "$MAIN"
            # Aggiungi registerPlugin nella onCreate
            grep -q "registerPlugin(NativeCastPlugin" "$MAIN" || \
              sed -i 's/super.onCreate(savedInstanceState);/super.onCreate(savedInstanceState);\n    registerPlugin(NativeCastPlugin.class);/' "$MAIN"
            echo "MainActivity aggiornata con NativeCastPlugin"
          else
            echo "ATTENZIONE: MainActivity.java non trovata in $MAIN"
          fi

          # ── 3. Aggiungi dipendenza Cast al build.gradle ─────────────────────
          BUILD="android/app/build.gradle"
          grep -q "play-services-cast-framework" "$BUILD" || \
            sed -i '/dependencies {/a\    implementation "com.google.android.gms:play-services-cast-framework:21.5.0"\n    implementation "androidx.mediarouter:mediarouter:1.7.0"' "$BUILD"
          echo "Dipendenze Cast aggiunte a build.gradle"

          # ── 4. Registra CastOptionsProvider in AndroidManifest ─────────────
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 android-native/inject_cast_manifest.py "$MANIFEST"

      - name: Aggiungi permessi AndroidManifest (Cast + Camera + Location)
        script: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # Rete locale per Chromecast discovery
          grep -q "CHANGE_NETWORK_STATE" "$MANIFEST" || \
            sed -i 's|<uses-permission android:name="android.permission.INTERNET"/>|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n    <uses-permission android:name="android.permission.CHANGE_WIFI_STATE"/>|' "$MANIFEST"
          # mDNS per Cast discovery su Android 12+
          grep -q "CHANGE_WIFI_MULTICAST_STATE" "$MANIFEST" || \
            sed -i 's|<uses-permission android:name="android.permission.INTERNET"/>|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/>|' "$MANIFEST"
          echo "AndroidManifest aggiornato:"
          grep "uses-permission" "$MANIFEST"

      - name: Imposta versione e build number
        script: |
          VERSION=$(node -p "require('./package.json').version")
          BUILD_NUM=$(( $(date +%s) % 2000000000 ))
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $BUILD_NUM/" android/app/build.gradle
          echo "Android $VERSION (versionCode $BUILD_NUM)"

      - name: Build APK debug
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - info@fermenta.to
        notify:
          success: true
          failure: true

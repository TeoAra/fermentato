# ═══════════════════════════════════════════════════════════════════════════════
# Codemagic CI/CD — Fermenta.to
#
# Tre workflow:
#   ios-development  → push su main  → IPA firmato su TestFlight
#   ios-appstore     → tag v*        → IPA per App Store review
#   android-apk      → push su main  → APK debug scaricabile + pronto per Play Store
#
# Integrazioni richieste (Codemagic → Team settings → Integrations):
#   • Apple Developer Portal: "Fermenta.to"
#
# Variabili d'ambiente da impostare in Codemagic (Environment variables):
#   CAST_APP_ID      → ID receiver Chromecast (default: 6666EC62)
#   APNS_KEY_ID      → Apple Push key ID (10 caratteri)
#   APNS_TEAM_ID     → Apple Team ID (10 caratteri)
#   APNS_P8_KEY      → Contenuto file .p8 con \n letterali
# ═══════════════════════════════════════════════════════════════════════════════

workflows:

  # ─── Build IPA firmato → TestFlight ─────────────────────────────────────────
  ios-development:
    name: iOS IPA → TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m1

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    integrations:
      app_store_connect: Fermenta.to

    environment:
      node: "20"
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: to.fermentato.app
        CAST_APP_ID: 6666EC62

    cache:
      cache_paths:
        - $HOME/.npm
        - $CM_BUILD_DIR/node_modules
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Install Node dependencies
        script: npm ci

      - name: Build web assets
        script: npm run build

      - name: Add iOS platform + fix deployment target + pod install
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios || true
          fi
          if [ ! -f "ios/App/Podfile" ]; then
            echo "ERRORE: Podfile non trovato dopo cap add ios"
            exit 1
          fi
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '16.0'/" ios/App/Podfile
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 16.0;/g" ios/App/App.xcodeproj/project.pbxproj
          rm -rf ios/App/Pods ios/App/Podfile.lock
          python3 ios-native/add_cast_pod.py ios/App/Podfile "google-cast-sdk"
          echo "=== Podfile ==="; cat ios/App/Podfile
          cd ios/App && pod install --repo-update
          grep -q "google-cast-sdk" Podfile.lock || { echo "ERRORE: google-cast-sdk non in Podfile.lock"; exit 1; }
          echo "google-cast-sdk installato correttamente"

      - name: Copia web assets e plugin Swift nel progetto iOS
        script: |
          npx cap copy ios
          cp scripts/NativeCast.swift ios/App/App/NativeCast.swift
          echo "NativeCast.swift copiato in ios/App/App/"
          python3 ios-native/add_swift_to_xcode.py \
            ios/App/App.xcodeproj/project.pbxproj NativeCast.swift
          python3 ios-native/set_bridging_header.py \
            ios/App/App.xcodeproj/project.pbxproj \
            "App/App-Bridging-Header.h" \
            ios/App/App/App-Bridging-Header.h
          python3 ios-native/inject_cast_appdelegate.py \
            ios/App/App/AppDelegate.swift "${CAST_APP_ID:-6666EC62}"

      - name: Abilita Push Notifications entitlement (APNs)
        script: |
          python3 ios-native/add_push_entitlement.py \
            ios/App/App.xcodeproj/project.pbxproj
          echo "=== App.entitlements ===" && cat ios/App/App/App.entitlements

      - name: Genera icone app iOS
        script: |
          set -e
          ICON_SRC="resources/icon.png"
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICONSET"
          sips -z 1024 1024 "$ICON_SRC" --out /tmp/icon-1024.png
          # Rimuovi alpha channel — Apple rifiuta icone trasparenti (errore 90717)
          # PNG→JPEG→PNG è il metodo affidabile con sips per appiattire l'alpha
          sips -s format jpeg /tmp/icon-1024.png --out /tmp/icon-1024-flat.jpg
          sips -s format png  /tmp/icon-1024-flat.jpg --out /tmp/icon-1024.png
          rm -f /tmp/icon-1024-flat.jpg
          for size in 20 29 40 58 60 76 80 87 120 152 167 180 1024; do
            sips -z $size $size /tmp/icon-1024.png --out "$ICONSET/Icon-${size}.png" 2>/dev/null || true
          done
          cat > "$ICONSET/Contents.json" << 'ICONEOF'
          {
            "images": [
              {"idiom":"iphone","size":"20x20","scale":"2x","filename":"Icon-40.png"},
              {"idiom":"iphone","size":"20x20","scale":"3x","filename":"Icon-60.png"},
              {"idiom":"iphone","size":"29x29","scale":"2x","filename":"Icon-58.png"},
              {"idiom":"iphone","size":"29x29","scale":"3x","filename":"Icon-87.png"},
              {"idiom":"iphone","size":"40x40","scale":"2x","filename":"Icon-80.png"},
              {"idiom":"iphone","size":"40x40","scale":"3x","filename":"Icon-120.png"},
              {"idiom":"iphone","size":"60x60","scale":"2x","filename":"Icon-120.png"},
              {"idiom":"iphone","size":"60x60","scale":"3x","filename":"Icon-180.png"},
              {"idiom":"ipad","size":"20x20","scale":"1x","filename":"Icon-20.png"},
              {"idiom":"ipad","size":"20x20","scale":"2x","filename":"Icon-40.png"},
              {"idiom":"ipad","size":"29x29","scale":"1x","filename":"Icon-29.png"},
              {"idiom":"ipad","size":"29x29","scale":"2x","filename":"Icon-58.png"},
              {"idiom":"ipad","size":"40x40","scale":"1x","filename":"Icon-40.png"},
              {"idiom":"ipad","size":"40x40","scale":"2x","filename":"Icon-80.png"},
              {"idiom":"ipad","size":"76x76","scale":"1x","filename":"Icon-76.png"},
              {"idiom":"ipad","size":"76x76","scale":"2x","filename":"Icon-152.png"},
              {"idiom":"ipad","size":"83.5x83.5","scale":"2x","filename":"Icon-167.png"},
              {"idiom":"ios-marketing","size":"1024x1024","scale":"1x","filename":"Icon-1024.png"}
            ],
            "info":{"author":"xcode","version":1}
          }
          ICONEOF
          echo "Icone iOS generate in $ICONSET"

      - name: Aggiungi purpose strings al Info.plist
        script: |
          PLIST="ios/App/App/Info.plist"
          CAST_APP_ID="${CAST_APP_ID:-6666EC62}"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Fermenta.to usa la fotocamera per scansionare codici a barre ed etichette di birre.'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'Fermenta.to usa la fotocamera per scansionare codici a barre ed etichette di birre.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Fermenta.to accede alle foto per permetterti di caricare immagini di birre, check-in e profilo.'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'Fermenta.to accede alle foto per permetterti di caricare immagini di birre, check-in e profilo.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'Fermenta.to salva nella tua libreria foto le immagini condivise dall'\''app.'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription 'Fermenta.to salva nella tua libreria foto le immagini condivise dall'\''app.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'Fermenta.to usa la posizione per mostrarti pub e birrifici vicino a te.'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription 'Fermenta.to usa la posizione per mostrarti pub e birrifici vicino a te.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string 'Fermenta.to usa la posizione per mostrarti pub e birrifici vicino a te.'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSLocationAlwaysAndWhenInUseUsageDescription 'Fermenta.to usa la posizione per mostrarti pub e birrifici vicino a te.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'Fermenta.to usa la rete locale per trovare dispositivi Chromecast vicini.'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSLocalNetworkUsageDescription 'Fermenta.to usa la rete locale per trovare dispositivi Chromecast vicini.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices:0 string '_googlecast._tcp'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices:1 string '_${CAST_APP_ID}._googlecast._tcp'" "$PLIST" 2>/dev/null || true
          # AirPlay 2: necessario per scoprire LG TV, Samsung TV, Apple TV tramite picker
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices:2 string '_airplay._tcp'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices:3 string '_raop._tcp'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          echo "Info.plist aggiornato:"
          /usr/libexec/PlistBuddy -c "Print" "$PLIST"

      - name: Imposta versione e build number
        script: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          BUILD_NUM=$(date +%s)
          cd ios/App
          sed -i '' "s/MARKETING_VERSION = [0-9.]*;/MARKETING_VERSION = $VERSION;/g" App.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9.]*;/CURRENT_PROJECT_VERSION = $BUILD_NUM;/g" App.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" App/Info.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VERSION" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" App/Info.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUM" App/Info.plist
          echo "Version: $VERSION  Build: $BUILD_NUM"

      - name: Inizializza keychain
        script: keychain initialize

      - name: Prepara chiave privata per certificato
        script: |
          if [ -n "$APPLE_DISTRIBUTION_PRIVATE_KEY" ]; then
            echo "$APPLE_DISTRIBUTION_PRIVATE_KEY" | base64 --decode > /tmp/apple_distribution_private_key
            chmod 600 /tmp/apple_distribution_private_key
            echo "Chiave caricata da env var APPLE_DISTRIBUTION_PRIVATE_KEY"
          else
            ssh-keygen -t rsa -b 2048 -m PEM -f /tmp/apple_distribution_private_key -q -N ""
            echo "ATTENZIONE: chiave generata al volo. Imposta APPLE_DISTRIBUTION_PRIVATE_KEY in Codemagic per build stabili."
          fi

      - name: Scarica certificati e profili (credenziali da integrazione UI)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/apple_distribution_private_key \
            --create

      - name: Aggiungi certificati al keychain
        script: keychain add-certificates

      - name: Applica profili al progetto Xcode
        script: xcode-project use-profiles

      - name: Build IPA firmato
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - info@fermenta.to
        notify:
          success: true
          failure: true

